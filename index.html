<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Súper Chela | Mini Juego</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="pagina">

    <!-- Decoración superior -->
    <div class="decoracion decoracion-izquierda"></div>
    <div class="decoracion decoracion-derecha"></div>

    <div class="contenido">

        <!-- ENCABEZADO -->
        <section class="encabezado">

            <div class="mini-linea">
                <span></span>
                <p>SÚPER</p>
                <span></span>
            </div>

            <h1>CHELA</h1>

            <h2>CREMERÍA Y ABARROTES</h2>

            <div class="separador"></div>

        </section>


        <!-- ========================================= -->
        <!-- MINI JUEGO -->
        <!-- ========================================= -->

        <section class="juego-section">

            <div class="juego-titulo">
                MINI JUEGO
            </div>

            <p class="instruccion">
                MUEVE A SAM DE IZQUIERDA A DERECHA
            </p>

            <div class="zona-juego" id="zonaJuego">

                <div class="sam" id="sam">
                    <img src="Sam.png" alt="Sam">
                </div>

            </div>

        </section>

    </div>


    <footer>
        SÚPER CHELA · CREMERÍA Y ABARROTES
    </footer>

</main>


<!-- ========================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================= -->
<script>

    const zonaJuego = document.getElementById("zonaJuego");
    const sam = document.getElementById("sam");

    let samX = 50;
    let ultimaPosicion = 50;
    let posicionPixel = 0;


    /* =========================================
       ACTUALIZAR POSICIÓN DE SAM
    ========================================= */

    function actualizarSam() {

        const rect = zonaJuego.getBoundingClientRect();

        posicionPixel = (samX / 100) * rect.width;

        sam.style.transform =
            "translate3d(" +
            (posicionPixel - sam.offsetWidth / 2) +
            "px, 0, 0)";
    }


    /* =========================================
       MOVER SAM
    ========================================= */

    function moverSam(posicionX) {

        const rect = zonaJuego.getBoundingClientRect();

        let porcentaje =
            ((posicionX - rect.left) / rect.width) * 100;


        // Limitar a los bordes
        porcentaje = Math.max(5, Math.min(95, porcentaje));


        samX = porcentaje;


        // Cambiar dirección
        if (samX < ultimaPosicion) {

            sam.classList.add("mirando-izquierda");
            sam.classList.remove("mirando-derecha");

        } else if (samX > ultimaPosicion) {

            sam.classList.add("mirando-derecha");
            sam.classList.remove("mirando-izquierda");

        }


        ultimaPosicion = samX;


        actualizarSam();
    }


    /* =========================================
       CONTROL CON DEDO / MOUSE
    ========================================= */

    zonaJuego.addEventListener("pointerdown", function(event) {

        moverSam(event.clientX);

        zonaJuego.setPointerCapture(event.pointerId);

    });


    zonaJuego.addEventListener("pointermove", function(event) {

        if (event.buttons > 0) {

            moverSam(event.clientX);

        }

    });


    zonaJuego.addEventListener("pointerup", function(event) {

        if (zonaJuego.hasPointerCapture(event.pointerId)) {

            zonaJuego.releasePointerCapture(event.pointerId);

        }

    });


    /* =========================================
       POSICIÓN INICIAL
    ========================================= */

    window.addEventListener("load", function() {

        actualizarSam();

    });


    /* =========================================
       AJUSTAR SI CAMBIA EL TAMAÑO
    ========================================= */

    window.addEventListener("resize", function() {

        actualizarSam();

    });

</script>


</body>
</html>
