<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Súper Chela | Mini Juego</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="pagina">

    <!-- Decoración superior -->
    <div class="decoracion decoracion-izquierda"></div>
    <div class="decoracion decoracion-derecha"></div>

    <div class="contenido">

        <!-- ENCABEZADO -->
        <section class="encabezado">

            <div class="mini-linea">
                <span></span>
                <p>SÚPER</p>
                <span></span>
            </div>

            <h1>CHELA</h1>

            <h2>CREMERÍA Y ABARROTES</h2>

            <div class="separador"></div>

        </section>


        <!-- ========================================= -->
        <!-- MINI JUEGO -->
        <!-- ========================================= -->

        <section class="juego-section">

            <div class="juego-titulo">
                MINI JUEGO
            </div>

            <p class="instruccion">
                MUEVE A SAM DE IZQUIERDA A DERECHA
            </p>

            <div class="zona-juego" id="zonaJuego">

                <div class="marcador" id="marcador">
                    PUNTOS: 0
                </div>

                <div class="queso" id="queso">
                    🧀
                </div>

                <div class="sam" id="sam">
                    <img src="Sam.png" alt="Sam">
                </div>

            </div>

        </section>

    </div>


    <footer>
        SÚPER CHELA · CREMERÍA Y ABARROTES
    </footer>

</main>


<!-- ========================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================= -->
<script>
    const zonaJuego = document.getElementById("zonaJuego");
    const sam = document.getElementById("sam");
    const queso = document.getElementById("queso");
    const marcador = document.getElementById("marcador");

    let samX = 0;
    let ultimaPosicion = 0;

    let puntos = 0;

    let quesoX = 0;
    let quesoY = -60;

    let velocidadQueso = 2.5;

    function colocarSamInicial() {

        const rect = zonaJuego.getBoundingClientRect();

        samX = rect.width / 2;
        ultimaPosicion = samX;

        sam.style.left = samX + "px";
    }

    function moverSam(posicionX) {

        const rect = zonaJuego.getBoundingClientRect();

        const samWidth = sam.offsetWidth;

        const x = posicionX - rect.left;

        const minX = samWidth / 2;
        const maxX = rect.width - samWidth / 2;

        const posicion = Math.max(
            minX,
            Math.min(maxX, x)
        );

        if (posicion < samX) {

            sam.classList.add("mirando-izquierda");
            sam.classList.remove("mirando-derecha");

        } else if (posicion > samX) {

            sam.classList.add("mirando-derecha");
            sam.classList.remove("mirando-izquierda");

        }

        ultimaPosicion = samX;
        samX = posicion;

        sam.style.left = samX + "px";
    }


    function nuevoQueso() {

        const rect = zonaJuego.getBoundingClientRect();

        const quesoSize = queso.offsetWidth;

        const margen = quesoSize / 2;

        quesoX =
            margen +
            Math.random() *
            (rect.width - quesoSize);

        quesoY = -quesoSize;

        queso.style.left = quesoX + "px";
        queso.style.top = quesoY + "px";
    }


    function detectarColision() {

        const samRect = sam.getBoundingClientRect();
        const quesoRect = queso.getBoundingClientRect();

        return !(
            samRect.right < quesoRect.left ||
            samRect.left > quesoRect.right ||
            samRect.bottom < quesoRect.top ||
            samRect.top > quesoRect.bottom
        );
    }


    function actualizarJuego() {

        quesoY += velocidadQueso;

        queso.style.top = quesoY + "px";


        if (detectarColision()) {

            puntos++;

            marcador.textContent =
                "PUNTOS: " + puntos;

            nuevoQueso();
        }


        const rect = zonaJuego.getBoundingClientRect();

        if (quesoY > rect.height) {

            nuevoQueso();
        }


        requestAnimationFrame(actualizarJuego);
    }


    zonaJuego.addEventListener(
        "pointerdown",
        function(event) {

            moverSam(event.clientX);

            zonaJuego.setPointerCapture(
                event.pointerId
            );
        }
    );


    zonaJuego.addEventListener(
        "pointermove",
        function(event) {

            if (event.buttons > 0) {

                moverSam(event.clientX);

            }
        }
    );


    zonaJuego.addEventListener(
        "pointerup",
        function(event) {

            if (
                zonaJuego.hasPointerCapture(
                    event.pointerId
                )
            ) {

                zonaJuego.releasePointerCapture(
                    event.pointerId
                );
            }
        }
    );


    window.addEventListener(
        "load",
        function() {

            colocarSamInicial();

            nuevoQueso();

            actualizarJuego();
        }
    );


    window.addEventListener(
        "resize",
        function() {

            const rect =
                zonaJuego.getBoundingClientRect();

            const samWidth =
                sam.offsetWidth;

            samX = Math.max(
                samWidth / 2,
                Math.min(
                    rect.width - samWidth / 2,
                    samX
                )
            );

            sam.style.left =
                samX + "px";
        }
    );
</script>


</body>
</html>
