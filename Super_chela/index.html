<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Súper Chela | Sorteo 15 de Septiembre</title>

<link rel="stylesheet" href="style.css">


</head>

<body>

<main class="pagina">

    <!-- Decoración superior -->
    <div class="decoracion decoracion-izquierda"></div>
    <div class="decoracion decoracion-derecha"></div>


    <!-- CONTENIDO PRINCIPAL -->

    <div class="contenido">

        <!-- Encabezado -->
        <section class="encabezado">

            <div class="mini-linea">
                <span></span>
                <p>SÚPER</p>
                <span></span>
            </div>

            <h1>CHELA</h1>

            <h2>CREMERÍA Y ABARROTES</h2>

            <div class="separador"></div>

        </section>


        <!-- Mensaje principal -->
        <section class="principal">

            <p class="estamos">¡ESTAMOS DE</p>

            <h3>RIFA!</h3>

            <p class="descripcion">
                Por cada <strong>$100</strong> de compra
            </p>

            <p class="boleto">
                RECIBE <strong>1 BOLETO</strong> GRATIS
            </p>

        </section>


        <!-- Cronómetro -->
        <section class="contador-section">

            <div class="etiqueta">
                SORTEO
            </div>

            <h4>15 DE SEPTIEMBRE</h4>

            <p class="hora-sorteo">
                A LAS 12:00 PM
            </p>


            <div class="contador">

                <div class="unidad">
                    <span id="dias">00</span>
                    <small>DÍAS</small>
                </div>

                <div class="puntos">:</div>

                <div class="unidad">
                    <span id="horas">00</span>
                    <small>HORAS</small>
                </div>

                <div class="puntos">:</div>

                <div class="unidad">
                    <span id="minutos">00</span>
                    <small>MINUTOS</small>
                </div>

                <div class="puntos">:</div>

                <div class="unidad">
                    <span id="segundos">00</span>
                    <small>SEGUNDOS</small>
                </div>

            </div>

        </section>


        <!-- Restricciones -->
        <section class="restricciones">

            <span>●</span>

            <p>
                NO PARTICIPAN COMPRAS DE
                <strong>CERVEZA NI CIGARROS.</strong>
            </p>

        </section>

    </div>


    <footer>
        SÚPER CHELA · CREMERÍA Y ABARROTES
    </footer>

</main>


<!-- ========================= -->
<!-- CRONÓMETRO -->
<!-- ========================= -->

<script>

    /*
        Fecha del sorteo:
        15 de septiembre de 2026
        12:00 PM

        La hora utilizada es la hora local
        del dispositivo del visitante.
    */

    const fechaSorteo = new Date(2026, 8, 15, 12, 0, 0);


    function actualizarContador() {

        const ahora = new Date();

        const diferencia = fechaSorteo - ahora;


        // Si ya llegó la fecha
        if (diferencia <= 0) {

            document.getElementById("dias").textContent = "00";
            document.getElementById("horas").textContent = "00";
            document.getElementById("minutos").textContent = "00";
            document.getElementById("segundos").textContent = "00";

            document.querySelector(".hora-sorteo").textContent =
                "¡EL SORTEO HA COMENZADO!";

            return;
        }


        // Cálculo del tiempo restante
        const dias = Math.floor(
            diferencia / (1000 * 60 * 60 * 24)
        );

        const horas = Math.floor(
            (diferencia / (1000 * 60 * 60)) % 24
        );

        const minutos = Math.floor(
            (diferencia / (1000 * 60)) % 60
        );

        const segundos = Math.floor(
            (diferencia / 1000) % 60
        );


        // Mostrar valores
        document.getElementById("dias").textContent =
            String(dias).padStart(2, "0");

        document.getElementById("horas").textContent =
            String(horas).padStart(2, "0");

        document.getElementById("minutos").textContent =
            String(minutos).padStart(2, "0");

        document.getElementById("segundos").textContent =
            String(segundos).padStart(2, "0");
    }


    // Ejecutar inmediatamente
    actualizarContador();


    // Actualizar cada segundo
    setInterval(actualizarContador, 1000);

</script>
